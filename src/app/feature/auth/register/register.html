<div class="container">
    <div class="card">
        <h1>Registro de Usuario</h1>
        <p>Completa los campos para registrarte</p>

        <form (ngSubmit)="onRegister()">

            <!-- Nombre -->
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" placeholder="Ingrese su nombre" [(ngModel)]="name" name="name" required />
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" placeholder="Ingrese su correo" [(ngModel)]="email" name="email"
                    required />
            </div>

            <!-- Contraseña con icono -->
            <div class="form-group password-group">
                <label for="password">Contraseña</label>
                <input [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Ingrese su contraseña"
                    [(ngModel)]="password" name="password" required />
                <button type="button" class="show-btn" (click)="togglePassword()">
                    <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        fill="currentColor" viewBox="0 0 16 16">
                        <path
                            d="M16 8s-3-5.333-8-5.333S0 8 0 8s3 5.333 8 5.333S16 8 16 8zm-8 3a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" />
                        <path d="M8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" />
                    </svg>
                    <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        fill="currentColor" viewBox="0 0 16 16">
                        <path
                            d="M13.359 11.238C12.03 12.342 10.104 13 8 13c-5 0-8-5-8-5a15.29 15.29 0 0 1 3.92-4.298L.646 1.646a.5.5 0 0 1 .708-.708l14 14a.5.5 0 0 1-.708.708l-3.287-3.287zM11.516 9.684l-1.48-1.48a3 3 0 0 0-3.024-3.024l-1.48-1.48A13.134 13.134 0 0 1 8 3.667c5 0 8 5 8 5a14.327 14.327 0 0 1-2.484 3.017z" />
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-animated">Registrar</button>
        </form>
    </div>
</div>
